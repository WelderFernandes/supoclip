      - SOCIAL_PERFORMANCE_MIN_POSTS=${SOCIAL_PERFORMANCE_MIN_POSTS:-3}
      - SOCIAL_PUBLISHING_ACCESS=${SOCIAL_PUBLISHING_ACCESS:-all}
      - SOCIAL_PUBLISHING_ALLOWED_EMAILS=${SOCIAL_PUBLISHING_ALLOWED_EMAILS:-}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", ".venv/bin/arq", "--check", "src.workers.tasks.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: supoclip-mcp
    expose:
      - "9100"
    volumes:
      - mcp_downloads:/app/supoclip-downloads
    environment:
      - SUPOCLIP_API_URL=${SUPOCLIP_API_URL:-http://backend:8000}
      - SUPOCLIP_DOWNLOAD_DIR=/app/supoclip-downloads
      - SUPOCLIP_TIMEOUT=${SUPOCLIP_TIMEOUT:-60}
      - SUPOCLIP_MCP_TRANSPORT=${SUPOCLIP_MCP_TRANSPORT:-sse}
      - SUPOCLIP_MCP_HOST=0.0.0.0
      - SUPOCLIP_MCP_PORT=9100
      - SUPOCLIP_MCP_PUBLIC_URL=${SUPOCLIP_MCP_PUBLIC_URL:-}
      - SUPOCLIP_MCP_REQUIRE_BEARER_AUTH=${SUPOCLIP_MCP_REQUIRE_BEARER_AUTH:-true}
    restart: unless-stopped
    networks:
      - dokploy-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1', 9100), 5); s.close()",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: supoclip-redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    command:
      [
        "sh",
        "-c",
        'if [ -n "$${REDIS_PASSWORD}" ]; then exec docker-entrypoint.sh redis-server --requirepass "$${REDIS_PASSWORD}"; fi; exec docker-entrypoint.sh redis-server',
      ]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - dokploy-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -n "$${REDIS_PASSWORD}" ]; then redis-cli -a "$${REDIS_PASSWORD}" ping; else redis-cli ping; fi',
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: supoclip-postgres
    environment:
      POSTGRES_DB: supoclip
      POSTGRES_USER: supoclip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # init.sql roda APENAS na primeira inicialização do volume (cria o
      # schema e a extensão uuid-ossp). Depois disso, nada atualiza o schema
      # sozinho — veja BACKLOG.md e o checklist de upgrade do app.
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supoclip -d supoclip"]
      interval: 30s
      timeout: 10s
      retries: 3

# NÃO incluído aqui: o serviço `ollama` que existe no docker-compose.yml
# (adicionado localmente). Ele soma 9,37 GB de imagem e RAM parada. Se quiser
# transcrição/análise 100% local, adicione-o de volta e aponte LLM=ollama:<modelo>.
# Este compose também usa a rede `dokploy-network` em vez de `supoclip-network`,
# porque o Traefik da Dokploy precisa alcançar os serviços.

volumes:
  uploads:
    driver: local
  clips:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local
  mcp_downloads:
    driver: local

networks:
  dokploy-network:
    external: true
